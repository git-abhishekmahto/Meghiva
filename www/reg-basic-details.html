<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
    <link rel="stylesheet" href="owlcarousel/owl.theme.default.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="container register-container">
        <div class="register-content reg-basic-content">
            <div class="register-header register-step-count-3">
                <div class="register-header-text">
                    <h2>Step 3 of 5: Verify mobile number</h2>
                </div>
                <div class="register-header-exit-text">
                    <h3>Exit</h3>
                </div>

            </div>
            <div class="register-top-content mt-2">
                <div class="login-top-text">
                    <h2>Basic profile details</h2>
                </div>
            </div>
            <div class="yes-no-checkbox-content reg-gender-radio-content">
                <div class="yes-no-check-box reg-gender-radio-box">
                    <label>
                        <input type="radio" name="gender" value="Male">
                        <h2>Male</h2>
                    </label>
                </div>
                <div class="yes-no-check-box reg-gender-radio-box">
                    <label>
                        <input type="radio" name="gender" value="Female">
                        <h2>Female</h2>
                    </label>
                </div>
                <div class="yes-no-check-box reg-gender-radio-box">
                    <label>
                        <input type="radio" name="gender" value="Other">
                        <h2>Other</h2>
                    </label>
                </div>
            </div>
            <div class="leave-duration-content ps-2 mt-16">
                <div class="leave-duration-content-title">
                    <h2>DOB</h2>
                    <h3>MM/DD/YYYY</h3>
                </div>
                <div class="leave-duration-input-content">
                    <input type="date" class="custom-date">
                    <div class="leave-duration-input-placeholder-icon my-date">
                        <svg width="16" height="18" viewBox="0 0 16 18" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M5.5 8.1665H3.83333V9.83317H5.5V8.1665ZM8.83333 8.1665H7.16667V9.83317H8.83333V8.1665ZM12.1667 8.1665H10.5V9.83317H12.1667V8.1665ZM13.8333 2.33317H13V0.666504H11.3333V2.33317H4.66667V0.666504H3V2.33317H2.16667C1.24167 2.33317 0.508333 3.08317 0.508333 3.99984L0.5 15.6665C0.5 16.5832 1.24167 17.3332 2.16667 17.3332H13.8333C14.75 17.3332 15.5 16.5832 15.5 15.6665V3.99984C15.5 3.08317 14.75 2.33317 13.8333 2.33317ZM13.8333 15.6665H2.16667V6.49984H13.8333V15.6665Z"
                                fill="black" fill-opacity="0.25" />
                        </svg>
                    </div>
                </div>
            </div>
            <div class="leave-type-content">
                <div class="leave-type-title">
                    <h2>Country</h2>
                </div>
                <div class="leave-type-select-content mt-05">
                    <div class="leave-type-select-content-title reg-select-type-title" id="toggle-leave-type-ul">
                        <h2>Select</h2>
                        <div class="leave-type-select-content-title-svg">
                            <svg width="12" height="8" viewBox="0 0 12 8" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M1.41 7.41L6 2.83L10.59 7.41L12 6L6 0L0 6L1.41 7.41Z"
                                    fill="black" />
                            </svg>
                        </div>
                    </div>
                    <ul class="leave-type-select-content-dropdown reg-select-type-content">
                        <li>Vacation</li>
                        <li>Medical</li>
                        <li>Family Emergency</li>
                        <li>Other</li>
                    </ul>
                </div>
            </div>
            <div class="leave-type-content  ">
                <div class="leave-type-title">
                    <h2>State</h2>
                </div>
                <div class="leave-type-select-content mt-05 ">
                    <div class="leave-type-select-content-title reg-select-type-title" id="toggle-leave-type-ul1">
                        <h2>Select</h2>
                        <div class="leave-type-select-content-title-svg">
                            <svg width="12" height="8" viewBox="0 0 12 8" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M1.41 7.41L6 2.83L10.59 7.41L12 6L6 0L0 6L1.41 7.41Z"
                                    fill="black" />
                            </svg>
                        </div>
                    </div>
                    <ul class="leave-type-select-content-dropdown leave-type-select-content-dropdown1 reg-select-type-content">
                        <li>Job Relocation</li>
                        <li>College Transfer</li>
                        <li>Family Issues</li>
                        <li>Financial Issues</li>
                        <li>Other</li>
                    </ul>
                </div>
            </div>
    




            <div class="login-middle-content"> 
                <div class="leave-duration-section mt-16">
                    <div class="leave-duration-content">
                        <div class="leave-duration-content-title">
                            <h2>City</h2>
                        </div>
                        <div class="leave-duration-input-content list-your-property-input">
                            <input class="enquire-input" type="text">
                        </div>
                    </div>
                </div>
            </div> 
            <div class="login-middle-content mb-180"> 
                <div class="leave-duration-section mt-16">
                    <div class="leave-duration-content">
                        <div class="leave-duration-content-title">
                            <h2>Postal code</h2>
                        </div>
                        <div class="leave-duration-input-content list-your-property-input">
                            <input class="enquire-input" type="number">
                        </div>
                    </div>
                </div>
            </div> 
            
            <div class="reg-use-location-btn">
                <button>
                    Use my current location 
                    <svg width="12" height="16" viewBox="0 0 12 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 15.5C5.825 15.5 5.675 15.45 5.55 15.35C5.425 15.25 5.33125 15.1187 5.26875 14.9562C5.03125 14.2562 4.73125 13.6 4.36875 12.9875C4.01875 12.375 3.525 11.6562 2.8875 10.8312C2.25 10.0062 1.73125 9.21875 1.33125 8.46875C0.94375 7.71875 0.75 6.8125 0.75 5.75C0.75 4.2875 1.25625 3.05 2.26875 2.0375C3.29375 1.0125 4.5375 0.5 6 0.5C7.4625 0.5 8.7 1.0125 9.7125 2.0375C10.7375 3.05 11.25 4.2875 11.25 5.75C11.25 6.8875 11.0313 7.8375 10.5938 8.6C10.1688 9.35 9.675 10.0938 9.1125 10.8312C8.4375 11.7312 7.925 12.4812 7.575 13.0812C7.2375 13.6687 6.95625 14.2937 6.73125 14.9562C6.66875 15.1312 6.56875 15.2688 6.43125 15.3688C6.30625 15.4563 6.1625 15.5 6 15.5ZM6 7.625C6.525 7.625 6.96875 7.44375 7.33125 7.08125C7.69375 6.71875 7.875 6.275 7.875 5.75C7.875 5.225 7.69375 4.78125 7.33125 4.41875C6.96875 4.05625 6.525 3.875 6 3.875C5.475 3.875 5.03125 4.05625 4.66875 4.41875C4.30625 4.78125 4.125 5.225 4.125 5.75C4.125 6.275 4.30625 6.71875 4.66875 7.08125C5.03125 7.44375 5.475 7.625 6 7.625Z" fill="#E10E0E"/>
                        </svg>                        
                </button>    
            </div>



            <div class="reg-footer-bottom-content">
                <a href="reg-cpmplete.html" class="reg-skip-btn">
                    <button>
                        Skip
                    </button>
                </a>
                <a href="reg-profile-photo.html" class="reg-continue-btn">
                    <button>
                        Continue
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4.16669 10H15.8334" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M10 4.16669L15.8333 10L10 15.8334" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>                            
                    </button>
                </a>
            </div>
        </div>
    </div>



    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
