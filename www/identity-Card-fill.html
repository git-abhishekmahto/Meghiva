<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
    <link rel="stylesheet" href="owlcarousel/owl.theme.default.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="container notification-container back-community-container">
        <div class="back-community-title-content">
            <div class="booking-history-title payment-title ">
                <div class="notification-title-content payment-title-content back-icon">
                    <a href="user-profile.html" class="notification-title-svg payment-title-svg">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M15.8333 10H4.16663" stroke="#363939" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M9.99996 15.8334L4.16663 10.0001L9.99996 4.16675" stroke="#363939" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </a>
                    <h2>Identity Card</h2>
                </div>
            </div>
        </div>
        <div class="upload-identity-card-container" id="custom-upload">
            <input type="file" style="display: none;" id="real-file">
            <div class="upload-identity-card-content">
                <div class="upload-identity-card-content-img">
                    <img src="assets/images/browse.png" alt="">
                </div>
                <div class="upload-identity-card-content-browse-text">
                    <h2>Browse Files</h2>
                </div>
                <div class="upload-identity-card-content-upload-aadhar-text">
                    <h2>Upload Your Aadhar Card</h2>
                </div>
            </div>
        </div>
    </div>




    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
        let customUpload = document.getElementById("custom-upload");
        let inputFile = document.getElementById("real-file");

        customUpload.addEventListener("click" , () => {
            inputFile.click();
        });

    </script>
</body>

</html>
