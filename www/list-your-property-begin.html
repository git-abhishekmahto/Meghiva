    <script>
        let propertyTypeListContent = document.querySelectorAll(".property-type-list-content");

        const queryString = window.location.search;
        const url = new URLSearchParams(queryString);
        const type = url.get('type');
        let stayType = '';

        if (type == 1){
            propertyTypeListContent[0].classList.add("active");
            stayType = localStorage.setItem("type" , 0);
        } else if (type == 2){
            propertyTypeListContent[1].classList.add("active");
            stayType = localStorage.setItem("type" , 1);
        } else if (type == 3){
            propertyTypeListContent[2].classList.add("active");
            stayType = localStorage.setItem("type" , 2);
        }
        let getStayType = localStorage.getItem("type");

        if(getStayType != null){

            propertyTypeListContent[getStayType].classList.add("active");
        }
        

        propertyTypeListContent.forEach((t , i) => {
            t.addEventListener("click" , () => {
                stayType = localStorage.setItem("type" , i);
                location.href = 'list-your-property-1.html';
            })
        });
