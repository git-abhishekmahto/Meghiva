<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
    <link rel="stylesheet" href="owlcarousel/owl.theme.default.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="registration-body">

    <div class="container register-container">
        <div class="register-content reg-basic-content">
            <div class="register-header register-step-count-5">
                <div class="register-header-text">
                    <h2>Step 5 of 5: Select role & preferences</h2>
                </div>
                <div class="register-header-exit-text">
                    <h3>Exit</h3>
                </div>

            </div>
            <div class="register-top-content mt-2">
                <div class="login-top-text">
                    <h2>Select role & preferences</h2>
                </div>
            </div>
            <div class="leave-type-content">
                <div class="leave-type-title">
                    <h2>Who are you?</h2>
                </div>
                <div class="leave-type-select-content mt-05">
                    <div class="leave-type-select-content-title reg-select-type-title" id="toggle-leave-type-ul">
                        <h2>Select</h2>
                        <div class="leave-type-select-content-title-svg">
                            <svg width="12" height="8" viewBox="0 0 12 8" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M1.41 7.41L6 2.83L10.59 7.41L12 6L6 0L0 6L1.41 7.41Z"
                                    fill="black" />
                            </svg>
                        </div>
                    </div>
                    <ul class="leave-type-select-content-dropdown reg-select-type-content">
                        <li>Student</li>
                        <li>Parent</li>
                        <li>Hostel Owner</li>
                    </ul>
                </div>
            </div>
            <div class="leave-type-content  ">
                <div class="leave-type-title">
                    <h2>Looking for?</h2>
                </div>
                <div class="leave-type-select-content mt-05 ">
                    <div class="leave-type-select-content-title reg-select-type-title" id="toggle-leave-type-ul1">
                        <h2>Select</h2>
                        <div class="leave-type-select-content-title-svg">
                            <svg width="12" height="8" viewBox="0 0 12 8" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M1.41 7.41L6 2.83L10.59 7.41L12 6L6 0L0 6L1.41 7.41Z"
                                    fill="black" />
                            </svg>
                        </div>
                    </div>
                    <ul class="leave-type-select-content-dropdown leave-type-select-content-dropdown1 reg-select-type-content">
                        <li>Hostel</li>
                        <li>PG</li>
                        <li>Flat</li>
                    </ul>
                </div>
            </div>
    
            <div class="all-stays-filter-modal-price ps-2 mb-120">
                <div class="all-stays-filter-modal-price-top ">
                    <h2><span id="print-price-min-val"> ₹6,000 </span> - <span id="print-price-max-val"> ₹14,000</span> </h2>
                </div>
                <div class="price-filter-tooltip-container">
                    <div class="price-filter-slider-track">
                        <div class="price-filter-tooltip-box" id="tooltip-min">
                            <div class="price-filter-tooltip-box-price-val" id="min-val">
                                ₹6000
                            </div>
                        </div>
                        <div class="price-filter-tooltip-box" id="tooltip-max">
                            <div class="price-filter-tooltip-box-price-val" id="max-val">
                                ₹16000
                            </div>
                        </div>
                        <div class="price-filter-tooltip-slider-input">
                            <input type="range" min="0" max="20000" value="2000" class="price-filter-range-input" id="min-price-input">
                            <input type="range" min="0" max="20000" value="14000" class="price-filter-range-input" id="max-price-input">
                        </div>
                    </div>
                </div>
            </div>





            <div class="reg-footer-bottom-content">
                <div class="reg-skip-btn">
                    <button>
                        Skip
                    </button>
                </div>
                <a href="reg-cpmplete.html" class="reg-continue-btn">
                    <button>
                        Continue
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4.16669 10H15.8334" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M10 4.16669L15.8333 10L10 15.8334" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>                            
                    </button>
                </a>
            </div>
        </div>
    </div>



    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="assets/js/script.js"></script>
    
</body>

</html>
