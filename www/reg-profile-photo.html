<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">

<body class="registration-body">

    <div class="container register-container">
        <div class="register-content reg-basic-content">
            <div class="register-header register-step-count-4">
                <div class="register-header-text">
                    <h2>Step 4 of 5: Profile photo</h2>
                </div>
                <div class="register-header-exit-text">
                    <h3>Exit</h3>
                </div>

            </div>
            <div class="register-top-content mt-2">
                <div class="login-top-text">
                    <h2>Add a photo.</h2>
                </div>
                <div class="register-top-1-text">
                    <h3>Add a photo so other members know who you are.</h3>
                </div>
                <input type="file" id="reg-user-profile-photo" hidden>
                <div class="reg-upload-photo-circle" id="trigger-reg-user-photo">
                    <svg width="30" height="32" viewBox="0 0 30 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M28.3333 31V27.6667C28.3333 25.8986 27.6309 24.2029 26.3807 22.9526C25.1304 21.7024 23.4347 21 21.6666 21H8.33329C6.56518 21 4.86949 21.7024 3.61925 22.9526C2.369 24.2029 1.66663 25.8986 1.66663 27.6667V31" stroke="#B1B2B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M15 14.3333C18.6819 14.3333 21.6667 11.3486 21.6667 7.66667C21.6667 3.98477 18.6819 1 15 1C11.3181 1 8.33337 3.98477 8.33337 7.66667C8.33337 11.3486 11.3181 14.3333 15 14.3333Z" stroke="#B1B2B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>

                </div>
            </div>
            







            <div class="reg-footer-bottom-content">
                <div class="reg-skip-btn">
                    <button>
                        Skip
                    </button>
                </div>
                <a href="reg-roll&pref.html" class="reg-continue-btn">
                    <button>
                        Upload my photo
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4.16669 10H15.8334" stroke="white" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M10 4.16669L15.8333 10L10 15.8334" stroke="white" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </a>
            </div>
        </div>
    </div>



    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="assets/js/script.js"></script>

</html>
