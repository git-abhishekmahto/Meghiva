<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
    <link rel="stylesheet" href="owlcarousel/owl.theme.default.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background-color: #C5D4D6;
        }

        .raise-complaints-container {
            background-color: #F5F5F5;

        }
    </style>
</head>

<body>

    <div class="container notification-container raise-complaints-container">
        <div class="notification-top-content">
            <div class="booking-history-title notification-title my-complaints-title" id="my-complaints-title">
                <div class="notification-title-content payment-title-content">
                    <a href="my-complaint-uicons.html" class="notification-title-svg">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M15.8333 10H4.16663" stroke="#363939" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M9.99996 15.8334L4.16663 10.0001L9.99996 4.16675" stroke="#363939" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </a>
                    <h2>Raise Complaint</h2>
                </div>
            </div>
        </div>
        <div class="my-complaints-top-content">
            <div class="showing-filter raise-complaints-top-title">
                <h2>Cleaning Issue</h2>
            </div>
            <a href="my-complaint-uicons.html" class="my-complaints-filter raise-complaints-top-title-right">
                <h2>Change</h2>
            </a>
        </div>
        <div class="raise-complaints-top-content">
            <div class="raise-complaints-top-content-title">
                <h2>Tell us your problem?</h2>
                <p>You can select one or more options.</p>
            </div>
            <!-- <div class="raise-complaints-checkbox">
                <div class="raise-complaints-checkbox-circle"></div>
                <div class="raise-complaints-checkbox-text">
                    <h2>Room Cleaning Issues</h2>
                </div>
            </div>
            <div class="raise-complaints-checkbox">
                <div class="raise-complaints-checkbox-circle"></div>
                <div class="raise-complaints-checkbox-text">
                    <h2>Bathroom Cleaning Issues</h2>
                </div>
            </div>
            <div class="raise-complaints-checkbox">
                <div class="raise-complaints-checkbox-circle"></div>
                <div class="raise-complaints-checkbox-text">
                    <h2>Mess & Dining Area Hygiene</h2>
                </div>
            </div>
            <div class="raise-complaints-checkbox">
                <div class="raise-complaints-checkbox-circle"></div>
                <div class="raise-complaints-checkbox-text">
                    <h2>Other</h2>
                </div>
            </div> -->
            <div class="raise-complaints-checkbox">
                <div class="issue-checkbox-group">
                    <label>
                        <input type="checkbox" name="issue" value="room" checked>
                        Room Cleaning Issues
                    </label>
                </div>
            </div>
            <div class="raise-complaints-checkbox">
                <div class="issue-checkbox-group">
                    <label>
                        <input type="checkbox" name="issue" value="room">
                        Bathroom Cleaning Issues
                    </label>
                </div>
            </div>
            <div class="raise-complaints-checkbox">

                <div class="issue-checkbox-group">
                    <label>
                        <input type="checkbox" name="issue" value="bathroom">
                        Mess & Dining Area Hygiene
                    </label>
                </div>
            </div>
            <div class="raise-complaints-checkbox">
                <div class="issue-checkbox-group">
                    <label>
                        <input type="checkbox" name="issue" value="mess">
                        Other
                    </label>
                </div>
            </div>
        </div>
        <div class="raise-complaints-top-content">
            <div class="raise-complaints-top-content-title">
                <h2>Add details</h2>
                <p>Details you think is important for us to know.</p>
            </div>
            <div class="raise-complaints-text-area-content">
                <textarea 
                    class="reason-for-leave-textarea"
                    maxlength="100"
                    placeholder="You can write things like “ Hostel washrooms are not cleaned regularly, causing bad smell and unhygienic conditions. ”"></textarea>
                    <div class="character-counter-leave-duration raise-complaints-char-count">0/100</div>
            </div>
        </div>
        <div class="raise-complaints-top-content">
            <div class="raise-complaints-top-content-title">
                <h2>Add photos</h2>
                <p>Please help us to find best staff and tools for your needs as soon as possible.</p>
            </div>
            <div class="raise-complaints-photo-content">
                <div class="raise-complaints-photo-plus-svg">
                    <svg width="31" height="31" viewBox="0 0 31 31" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M19.375 8.66667H19.3896M15.7292 27.625H6.25C5.08968 27.625 3.97688 27.1641 3.15641 26.3436C2.33594 25.5231 1.875 24.4103 1.875 23.25V5.75C1.875 4.58968 2.33594 3.47688 3.15641 2.65641C3.97688 1.83594 5.08968 1.375 6.25 1.375H23.75C24.9103 1.375 26.0231 1.83594 26.8436 2.65641C27.6641 3.47688 28.125 4.58968 28.125 5.75V15.2292"
                            stroke="#CBD2E0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                        <path
                            d="M1.875 20.3333L9.16667 13.0417C10.52 11.7394 12.1883 11.7394 13.5417 13.0417L19.375 18.875"
                            stroke="#CBD2E0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                        <path
                            d="M17.9166 17.4164L19.375 15.9581C20.352 15.0189 21.4895 14.7564 22.557 15.1706M20.8333 24.7081H29.5833M25.2083 20.3331V29.0831"
                            stroke="#CBD2E0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
            </div>
        </div>
        <label class="raise-complaints-urgent-box">
            <!-- <div class="raise-complaints-checkbox-square"></div>
            <div class="raise-complaints-checkbox-text">
                <h2>Is this complaint urgent?</h2>
            </div> -->
            <input type="checkbox" class="raise-complaints-checkbox-square custom-checkbox ">
            <div class="raise-complaints-checkbox-text">
                <h2>Is this complaint urgent?</h2>
            </div> 
        </label>
        <div class="raise-complaints-footer">
            <a href="complaint-confirm.html" class="raise-complaints-footer-btn inline-block">
                <button>
                    <h2>Submit</h2>
                </button>
            </a>
        </div>
    </div>





    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script>

        window.addEventListener("scroll", () => {
            let compl = document.getElementById("my-complaints-title");


            if (window.scrollY > 55) {
                compl.style.borderBottom = "1px solid #D2D3D3"
            } else {
                compl.style.borderBottom = "none"
            }
        })
    </script>
</body>

</html>
