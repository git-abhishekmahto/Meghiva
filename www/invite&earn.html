<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
    <link rel="stylesheet" href="owlcarousel/owl.theme.default.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="container notification-container hostel-rules-container invite-earn-container">
        <div class="back-community-title-content">
            <div class="booking-history-title payment-title ">
                <div class="notification-title-content payment-title-content back-icon">
                    <a href="index.html" class="notification-title-svg payment-title-svg">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M15.8333 10H4.16663" stroke="#363939" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M9.99996 15.8334L4.16663 10.0001L9.99996 4.16675" stroke="#363939" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </a>
                    <div class="community-top-title">
                        <h2>Invite & Earn</h2>
                    </div>
                </div>
            </div>
        </div>
        <div class="inv-earn-top-content">
            <div class="inv-coupon-code-content">
                <div class="inv-coupon-code-top">
                    <div class="inv-coupon-code-top-text">
                        <h2>MANI30</h2>
                    </div>
                    <div class="inv-coupon-code-top-svg">
                        <svg width="34" height="35" viewBox="0 0 34 35" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M5.09998 14.1C5.09998 12.2222 6.62221 10.7 8.49998 10.7H20.4C22.2777 10.7 23.8 12.2222 23.8 14.1V26C23.8 27.8778 22.2777 29.4 20.4 29.4H8.49998C6.62221 29.4 5.09998 27.8778 5.09998 26V14.1ZM20.4 14.1H8.49998V26H20.4V14.1Z" fill="#FABE3A"/>
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M23.8 9.17892L10.2 9.17898L10.2 5.77898L23.7999 5.77892C26.6166 5.77891 28.9 8.06226 28.9 10.8789V24.3H25.5V10.8789C25.5 9.94004 24.7388 9.17892 23.8 9.17892Z" fill="#FABE3A"/>
                            </svg>
                            
                    </div>
                </div>
                <div class="tap-to-copy-code">
                    <h2>Tap to copy code</h2>
                </div>
            </div>
        </div>
        <div class="inv-earn-form-content">
            <div class="inv-earn-form">
                <label for="friend-name">Friend’s Name</label>
                <input type="text" id="friend-name" placeholder="Enter name">
            </div>
            <div class="inv-earn-form">
                <label for="friend-mobile-no">Friend’s Mobile number</label>
                <input type="text" id="friend-mobile-no" class="pl-10" placeholder="9800001990">
                <div class="friend-mobile-no-input-before">
                    <div class="country-flag-input-img">
                        <img src="assets/images/country.png" alt="country">
                    </div>
                    <div class="country-flag-input-down-arrow-svg">
                        <svg width="8" height="5" viewBox="0 0 8 5" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M7.37292 0.64617C7.25367 0.468818 7.06653 0.327082 6.84544 0.248583C6.69224 0.19843 6.23265 0.120657 6.22482 0.120657C5.72258 0.0421573 4.90612 0 4.00435 0C3.14524 0 2.36272 0.0421573 1.85265 0.10612C1.84394 0.113389 1.27468 0.191888 1.07884 0.27693C0.721089 0.433203 0.5 0.738479 0.5 1.06556V1.09391C0.508704 1.30688 0.729794 1.75389 0.738498 1.75389C1.11278 2.50691 2.27742 3.99186 3.0521 4.58788C3.0521 4.58788 3.25143 4.75651 3.37503 4.82919C3.55347 4.94331 3.77456 5 3.99652 5C4.24285 5 4.47177 4.93604 4.65979 4.81538C4.69373 4.78703 4.83822 4.68019 4.95747 4.58133C5.70517 3.9984 6.93074 2.47856 7.30415 1.68338C7.36421 1.56273 7.49217 1.25672 7.5 1.09391C7.5 0.937636 7.45822 0.787905 7.37292 0.64617Z" fill="#3C6F75"/>
                            </svg>                            
                    </div>
                    <div class="country-mobile-code">
                        <h2>+971</h2>
                    </div>
                    <div class="country-mobile-line"></div>
                </div>
            </div>
        </div>
        <div class="inv-earn-alert-msg">
            <div class="inv-earn-alert-msg-text">
                <h2>Note: This number should be used by the friend while signing up.</h2>
            </div>
        </div>
        <div class="inv-Share-through">
            <div class="inv-Share-through-text">
                <h2>Share through</h2>
            </div>
            <div class="inv-Share-through-content">
                <a href="#" class="inv-Share-through-link">
                    <div class="inv-Share-through-img">
                        <img src="assets/images/insta.png" alt="instagram">
                    </div>
                </a>
                <a href="#" class="inv-Share-through-link">
                    <div class="inv-Share-through-img">
                        <img src="assets/images/twitter.png" alt="twiter">
                    </div>
                </a>
                <a href="#" class="inv-Share-through-link">
                    <div class="inv-Share-through-img">
                        <img src="assets/images/face.png" alt="facebook">
                    </div>
                </a>
                <a href="#" class="inv-Share-through-link">
                    <div class="inv-Share-through-img">
                        <img src="assets/images/whatsapp.png" alt="whatsapp">
                    </div>
                </a>
                <a href="#" class="inv-Share-through-link">
                    <div class="inv-Share-through-img">
                        <img src="assets/images/google.png" alt="google">
                    </div>
                </a>
            </div>
        </div>
        <div class="inv-how-it-work">
            <div class="inv-Share-through-text">
                <h2>How does it work?</h2>
            </div>
            <ul class="inv-how-it-work-ul"> 
                <li>Sharing buttons at the bottom of your page</li>
                <li>Go to the page and share the code. Once merchant use this code to register to the system...</li>
            </ul>
        </div>
    </div>




    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
