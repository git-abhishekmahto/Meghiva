    <script>
        let stayUl = document.getElementById("toggle-leave-type-ul");
        let stayUlSelectText = stayUl.querySelector("h2");

        let getStayUrl = localStorage.getItem("type");
        if (getStayUrl == 0){
            stayUlSelectText.textContent = 'hostel';
        } else if(getStayUrl == 1){
            stayUlSelectText.textContent = 'PGs';
        } else if (getStayUrl == 2){
            stayUlSelectText.textContent = 'Flat';
        } 
    </script>
