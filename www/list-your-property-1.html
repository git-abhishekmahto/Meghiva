<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
    <link rel="stylesheet" href="owlcarousel/owl.theme.default.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="container notification-container hostel-rules-container">
        <div class="booking-history-title payment-title ">
            <div class="notification-title-content payment-title-content back-icon ">
                <a href="list-your-property-begin.html" class="notification-title-svg payment-title-svg">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15.8333 10H4.16663" stroke="#363939" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M9.99996 15.8334L4.16663 10.0001L9.99996 4.16675" stroke="#363939" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </a>
                <div class="logo logo-1">
                    <img src="assets/images/meghani-removebg-preview.png" alt="logo.png">
                </div>
            </div>
        </div>
        <div class="list-your-property-top-content">
            <!-- <div class="list-your-property-progress-text">
                <h3><span>2</span> of 6 steps completed</h3>
            </div> -->
            <div class="list-your-property-progress-box-content">
                <div class="list-your-property-progress-box fill-box"></div>
                <div class="list-your-property-progress-box fill-box"></div>
                <div class="list-your-property-progress-box "></div>
                <div class="list-your-property-progress-box "></div>
                <div class="list-your-property-progress-box "></div>
                <div class="list-your-property-progress-box "></div>
            </div>
            <div class="list-your-property-top-text">
                <h2>Owner Contact Details</h2>
            </div>
        </div>
        <div class="leave-duration-section mt-16">
            <div class="leave-duration-content">
                <div class="leave-duration-content-title">
                    <h2>Name</h2>
                </div>
                <div class="leave-duration-input-content list-your-property-input">
                    <input type="text" placeholder="Name" id="owner-name">
                </div>
            </div>
        </div>
        <div class="leave-duration-section mt-16">
            <div class="leave-duration-content">
                <div class="leave-duration-content-title">
                    <h2>Phone Number</h2>
                </div>
                <div class="leave-duration-input-content list-your-property-input">
                    <input type="number" placeholder="Phone Number" id="owner-phone-no">
                </div>
            </div>
        </div>
        <div class="leave-duration-section mt-16">
            <div class="leave-duration-content">
                <div class="leave-duration-content-title">
                    <h2>Email</h2>
                </div>
                <div class="leave-duration-input-content list-your-property-input">
                    <input type="text" placeholder="Email" id="owner-email">
                </div>
            </div>
        </div>






        <div class="filter-modal-footer list-your-property-footer">
            <div
                class="filter-modal-footer-show-result-btn filter-modal-footer-user-done">
                <button onclick="ownerConatctDetails()">
                    Next
                </button>
            </div>
        </div>
    </div>




    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
        let loginStatus = localStorage.getItem("login-status");

        if (loginStatus != 1) {
            alert("first-you-login");
            location.href = 'login.html?get=list-your-property';
        };
        fetchOwnerDetails();
    </script>
</body>

</html>
